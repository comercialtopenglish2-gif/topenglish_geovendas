<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoVenda · Entrar</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/login/login.css">
</head>
<body>
<main class="card">
  <h1>GeoVenda</h1>
  <p class="sub">Processos Comerciais e Inteligência de praça para vender mais!</p>
  <form id="f" novalidate>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" name="password" type="password" autocomplete="current-password" required>
    <p id="msg" class="msg" role="alert" hidden></p>
    <button class="btn" type="submit" id="entrar">Entrar</button>
  </form>
  <p class="nota">Use o mesmo e-mail e senha do sistema da Top English.</p>
  <p class="by">by <b>CNC Training &amp; Consulting</b></p>
</main>
<script src="/login/login.js"></script>
</body>
</html>
