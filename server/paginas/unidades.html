<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GeoVenda · Unidades</title><link rel="stylesheet" href="/login/login.css">
<style>body{display:block}.wrap{max-width:900px;margin:0 auto}.card{max-width:none}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}td input{padding:6px 8px}td input.uf{width:60px;text-transform:uppercase}.ok{color:#1F7A3E}.tw{overflow-x:auto}</style></head>
<body><div class="wrap"><main class="card">
<h1>Unidades</h1>
<p class="sub">Estado (UF) e cidade de cada unidade do CMS. O master só entra no GeoVenda depois que a UF da unidade dele estiver preenchida. As unidades aparecem aqui depois do primeiro login de alguém delas.</p>
<div class="tw"><table><thead><tr><th>ID CMS</th><th>Nome</th><th>UF</th><th>Cidade</th><th>Pessoas</th><th></th></tr></thead><tbody id="t"></tbody></table></div>
<p class="nota"><a href="/">Voltar ao GeoVenda</a></p>
</main></div>
<script>
(async function(){
  const t=document.getElementById("t");
  const r=await fetch("/api/unidades",{credentials:"same-origin"}); if(!r.ok){t.innerHTML="<tr><td colspan=6>Sem acesso.</td></tr>";return}
  const lista=await r.json();
  if(!lista.length){t.innerHTML="<tr><td colspan=6>Nenhuma unidade ainda.</td></tr>";return}
  lista.forEach(u=>{const tr=document.createElement("tr");
    tr.innerHTML=`<td></td><td><input class="n"></td><td><input class="uf" maxlength="2"></td><td><input class="c"></td><td></td><td><button class="btn" style="margin:0;width:auto;padding:8px 12px">Salvar</button> <span class="ok" hidden>Salvo</span></td>`;
    tr.children[0].textContent=u.unit_id; tr.querySelector(".n").value=u.nome||""; tr.querySelector(".uf").value=u.uf||""; tr.querySelector(".c").value=u.cidade||""; tr.children[4].textContent=u.pessoas;
    tr.querySelector("button").onclick=async()=>{const ok=tr.querySelector(".ok");ok.hidden=true;
      const rr=await fetch("/api/unidades/"+u.unit_id,{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:tr.querySelector(".n").value,uf:tr.querySelector(".uf").value,cidade:tr.querySelector(".c").value})});
      const j=await rr.json().catch(()=>({})); ok.textContent=rr.ok?"Salvo":(j.message||"Erro"); ok.hidden=false};
    t.append(tr)});
})();
</script></body></html>
